[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "packet-hound"
version = "1.0.0"
description = "Pure-Python Network Packet Dissector, 5-Tuple Flow Reconstructor & Cyber Threat Detection Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Aditya Singh", email = "adityasingh120444@gmail.com"}]
keywords = ["pcap", "network", "security", "packet-analysis", "threat-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/Adityasingh230058/packet-hound"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
